services:
  postgres:
    image: postgres:16
    container_name: ecommerce-learnEcom
    environment:
      POSTGRES_DB: ecom
      POSTGRES_USER: learnecom
      POSTGRES_PASSWORD: pgadmin123
    ports:
      - "5544:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  keycloak-db:
    image: postgres:17
    container_name: keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak-data:/var/lib/postgresql/data

  keycloak:
      image: quay.io/keycloak/keycloak:latest   # pin a version (e.g. 26.x) once you're happy with it
      container_name: keycloak
      command: start-dev --import-realm
      environment:
        KC_BOOTSTRAP_ADMIN_USERNAME: admin
        KC_BOOTSTRAP_ADMIN_PASSWORD: admin001
        KC_DB: postgres
        KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
        KC_DB_USERNAME: keycloak
        KC_DB_PASSWORD: keycloak
        KC_HOSTNAME: http://localhost:8180        # tokens always say iss=http://localhost:8180/...
        KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"   # lets other containers call it as http://keycloak:8080
      ports:
        - "8180:8080"
      volumes:
        - ./keycloak:/opt/keycloak/data/import
      depends_on:
        - keycloak-db


volumes:
  postgres_data:
  ecom-data:
  keycloak-data: